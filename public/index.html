<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conversor XML → Excel | Amazon Orders</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      max-width: 560px;
      width: 100%;
      padding: 40px 36px 36px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .logo svg { flex-shrink: 0; }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #1a202c;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #718096;
      margin-top: 2px;
    }

    .drop-zone {
      border: 2px dashed #cbd5e0;
      border-radius: 10px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-top: 8px;
    }

    .drop-zone:hover, .drop-zone.drag-over {
      border-color: #f90;
      background: #fffbf0;
    }

    .drop-zone input { display: none; }

    .drop-icon { font-size: 2.5rem; margin-bottom: 10px; }

    .drop-text {
      font-size: 0.95rem;
      color: #4a5568;
    }

    .drop-text span {
      color: #d97706;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline dotted;
    }

    .file-ext {
      font-size: 0.78rem;
      color: #a0aec0;
      margin-top: 6px;
    }

    /* Status bar */
    .status {
      margin-top: 18px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.88rem;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .status.info    { display: flex; background: #ebf8ff; color: #2b6cb0; }
    .status.success { display: flex; background: #f0fff4; color: #276749; }
    .status.error   { display: flex; background: #fff5f5; color: #c53030; }

    .status-icon { font-size: 1.1rem; flex-shrink: 0; }

    /* Preview table */
    .preview-wrap {
      margin-top: 20px;
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      display: none;
    }

    table {
      border-collapse: collapse;
      font-size: 0.76rem;
      white-space: nowrap;
      width: 100%;
    }

    thead tr { background: #f7fafc; }

    th, td {
      padding: 6px 10px;
      border-bottom: 1px solid #e2e8f0;
      border-right: 1px solid #e2e8f0;
      text-align: left;
    }

    th { font-weight: 600; color: #4a5568; position: sticky; top: 0; background: #f7fafc; }

    .preview-note {
      font-size: 0.75rem;
      color: #a0aec0;
      margin-top: 6px;
      text-align: right;
    }

    /* Download button */
    .btn-download {
      display: none;
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      background: #f90;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-download:hover { background: #e68900; }
    .btn-download:active { transform: scale(0.98); }

    .reset-link {
      display: block;
      text-align: center;
      margin-top: 14px;
      font-size: 0.82rem;
      color: #a0aec0;
      cursor: pointer;
      text-decoration: underline dotted;
    }

    .reset-link:hover { color: #718096; }

    footer {
      margin-top: 28px;
      font-size: 0.75rem;
      color: #cbd5e0;
      text-align: center;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="36" height="36" rx="8" fill="#FF9900"/>
      <path d="M8 18L16 10L24 18L16 26L8 18Z" fill="white" fill-opacity="0.9"/>
      <rect x="19" y="12" width="10" height="12" rx="2" fill="white" fill-opacity="0.9"/>
    </svg>
    <div>
      <h1>Conversor XML → Excel</h1>
      <div class="subtitle">Pedidos Amazon · formato .xlsx</div>
    </div>
  </div>

  <!-- Drop zone -->
  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept=".xml,text/xml,application/xml" />
    <div class="drop-icon">📄</div>
    <div class="drop-text">
      Arraste o arquivo XML aqui ou
      <span onclick="document.getElementById('fileInput').click()">clique para selecionar</span>
    </div>
    <div class="file-ext">Apenas arquivos .xml</div>
  </div>

  <!-- Status -->
  <div class="status" id="status">
    <span class="status-icon" id="statusIcon"></span>
    <span id="statusText"></span>
  </div>

  <!-- Preview -->
  <div class="preview-wrap" id="previewWrap">
    <table id="previewTable"></table>
  </div>
  <div class="preview-note" id="previewNote"></div>

  <!-- Download -->
  <button class="btn-download" id="btnDownload" onclick="downloadExcel()">
    ⬇ Baixar Excel (.xlsx)
  </button>
  <span class="reset-link" id="resetLink" style="display:none" onclick="reset()">Converter outro arquivo</span>

  <footer>Os dados são processados localmente · nenhuma informação é enviada para servidores</footer>
</div>

<script>
  /* ── state ── */
  let parsedRows = [];    // [{col: val, ...}, ...]
  let headers = [];
  let outputFilename = 'pedidos_amazon.xlsx';

  /* ── helpers ── */
  function setStatus(type, icon, text) {
    const el = document.getElementById('status');
    el.className = 'status ' + type;
    document.getElementById('statusIcon').textContent = icon;
    document.getElementById('statusText').textContent = text;
  }

  function parseXml(xmlText) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(xmlText, 'application/xml');
    const parseError = doc.querySelector('parsererror');
    if (parseError) throw new Error('XML inválido: ' + parseError.textContent.slice(0, 120));

    const paras = Array.from(doc.querySelectorAll('para'));
    if (paras.length < 2) throw new Error('Nenhum dado encontrado no XML (esperado ao menos 2 elementos <para>).');

    // First <para> = header row; split by tab (&#9;) or sequences of spaces ≥2
    const splitRow = text => text
      .replace(/\r|\n/g, '')
      .split(/\t/)
      .map(s => s.trim());

    const rawHeaders = splitRow(paras[0].textContent);
    headers = rawHeaders.filter(h => h.length > 0);

    const rows = [];
    for (let i = 1; i < paras.length; i++) {
      const cells = splitRow(paras[i].textContent);
      // Pad or trim to match header count
      while (cells.length < headers.length) cells.push('');
      const obj = {};
      headers.forEach((h, idx) => { obj[h] = cells[idx] ?? ''; });
      rows.push(obj);
    }
    return rows;
  }

  function buildPreview(rows) {
    const MAX = 5;
    const wrap = document.getElementById('previewWrap');
    const tbl = document.getElementById('previewTable');
    const note = document.getElementById('previewNote');

    // Show only first 8 columns to fit screen
    const visibleHeaders = headers.slice(0, 8);

    let html = '<thead><tr>' + visibleHeaders.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>';
    rows.slice(0, MAX).forEach(row => {
      html += '<tr>' + visibleHeaders.map(h => `<td>${row[h] ?? ''}</td>`).join('') + '</tr>';
    });
    html += '</tbody>';
    tbl.innerHTML = html;

    note.textContent = `Pré-visualização: ${Math.min(MAX, rows.length)} de ${rows.length} linha(s) · ${headers.length} colunas`;
    wrap.style.display = 'block';
    note.style.display = 'block';
  }

  function downloadExcel() {
    if (!parsedRows.length) return;

    // Build worksheet from array of objects — preserves column order
    const ws = XLSX.utils.json_to_sheet(parsedRows, { header: headers });

    // Style header row (bold via sheetview — basic, SheetJS CE doesn't do full styles)
    // Set column widths heuristically
    const colWidths = headers.map(h => {
      const maxLen = Math.max(
        h.length,
        ...parsedRows.slice(0, 20).map(r => String(r[h] ?? '').length)
      );
      return { wch: Math.min(Math.max(maxLen + 2, 10), 50) };
    });
    ws['!cols'] = colWidths;

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Pedidos');

    XLSX.writeFile(wb, outputFilename);
    setStatus('success', '✅', `Download iniciado: ${outputFilename}`);
  }

  function processFile(file) {
    if (!file) return;
    if (!file.name.toLowerCase().endsWith('.xml')) {
      setStatus('error', '❌', 'Por favor, selecione um arquivo .xml válido.');
      return;
    }

    outputFilename = file.name.replace(/\.xml$/i, '') + '.xlsx';
    setStatus('info', '⏳', 'Lendo e processando o arquivo…');

    const reader = new FileReader();
    reader.onload = e => {
      try {
        parsedRows = parseXml(e.target.result);
        buildPreview(parsedRows);
        setStatus('success', '✅', `${parsedRows.length} linha(s) carregada(s) com sucesso · ${headers.length} colunas detectadas.`);
        document.getElementById('btnDownload').style.display = 'block';
        document.getElementById('resetLink').style.display = 'block';
        document.getElementById('dropZone').style.pointerEvents = 'none';
        document.getElementById('dropZone').style.opacity = '0.5';
      } catch (err) {
        setStatus('error', '❌', err.message);
      }
    };
    reader.onerror = () => setStatus('error', '❌', 'Erro ao ler o arquivo.');
    reader.readAsText(file, 'UTF-8');
  }

  function reset() {
    parsedRows = []; headers = [];
    document.getElementById('fileInput').value = '';
    document.getElementById('status').className = 'status';
    document.getElementById('previewWrap').style.display = 'none';
    document.getElementById('previewNote').style.display = 'none';
    document.getElementById('btnDownload').style.display = 'none';
    document.getElementById('resetLink').style.display = 'none';
    document.getElementById('dropZone').style.pointerEvents = '';
    document.getElementById('dropZone').style.opacity = '';
    document.getElementById('previewTable').innerHTML = '';
  }

  /* ── events ── */
  document.getElementById('fileInput').addEventListener('change', e => {
    processFile(e.target.files[0]);
  });

  const dz = document.getElementById('dropZone');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', e => {
    e.preventDefault();
    dz.classList.remove('drag-over');
    processFile(e.dataTransfer.files[0]);
  });
</script>
</body>
</html>
